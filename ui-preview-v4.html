tton class="date-cell   " onclick="choose('2026-11-12')" aria-label="11월 12일 미응답"><span class="date-number" data-weekday="목">12</span><span class="status-label unset">미응답</span><span class="date-meal">—</span></button><button class="date-cell   " onclick="choose('2026-11-13')" aria-label="11월 13일 미응답"><span class="date-number" data-weekday="금">13</span><span class="status-label unset">미응답</span><span class="date-meal">—</span></button><button class="date-cell   " onclick="choose('2026-11-16')" aria-label="11월 16일 미응답"><span class="date-number" data-weekday="월">16</span><span class="status-label unset">미응답</span><span class="date-meal">—</span></button><button class="date-cell   " onclick="choose('2026-11-17')" aria-label="11월 17일 미응답"><span class="date-number" data-weekday="화">17</span><span class="status-label unset">미응답</span><span class="date-meal">—</span></button><button class="date-cell   " onclick="choose('2026-11-18')" aria-label="11월 18일 미응답"><span class="date-number" data-weekday="수">18</span><span class="status-label unset">미응답</span><span class="date-meal">—</span></button><button class="date-cell   " onclick="choose('2026-11-19')" aria-label="11월 19일 미응답"><span class="date-number" data-weekday="목">19</span><span class="status-label unset">미응답</span><span class="date-meal">—</span></button><button class="date-cell   " onclick="choose('2026-11-20')" aria-label="11월 20일 미응답"><span class="date-number" data-weekday="금">20</span><span class="status-label unset">미응답</span><span class="date-meal">—</span></button></div></div><div class="schedule-editor"><div class="editor-heading"><strong>11월 4일 <span>수요일</span></strong><span class="deadline"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#clock"/></svg>당일 11시 마감</span></div><div class="meal-options"><button class="meal-option chosen" onclick="meal='lunchbox';render()"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#fork"/></svg><span>도시락</span><span class="radio"><span></span></span></button><button class="meal-option " onclick="meal='outside';render()"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#fork"/></svg><span>외부 식사</span><span class="radio"></span></button><button class="meal-option " onclick="meal='any';render()"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#leaf"/></svg><span>상관없음</span><span class="radio"></span></button></div><div class="editor-actions"><button class="text-button" onclick="update('unset')">참여 취소</button><button class="primary" onclick="update('join')">변경 저장 <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#arrow"/></svg></button></div><p class="editor-footnote">편성 후 식사 방식 변경은 취소 후 재신청으로 처리됩니다.</p></div></section><aside class="right-column"><section class="panel today-panel"><h2>11월 4일 조원</h2><div class="group-label"><span>도시락 · 2조</span><strong>3<small> / 5명</small></strong></div><div class="mate-list"><div class="mate "><span class="mate-avatar color-0">유경</span><span class="mate-name">부유경</span><span class="mate-class">5반</span></div><div class="mate is-me"><span class="mate-avatar color-1">도영</span><span class="mate-name">권도영<small>나</small></span><span class="mate-class">4반</span></div><div class="mate "><span class="mate-avatar color-2">주연</span><span class="mate-name">김주연</span><span class="mate-class">5반</span></div></div><button class="full-button" onclick="nav('groups')">전체 조 편성 <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#arrow"/></svg></button></section><section class="timing-card"><div class="timing-title"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#clock"/></svg><strong>신청 시간</strong></div><div class="timeline"><div><i></i><span>전날 22:00</span><strong>최초 편성</strong></div><div><i></i><span>당일 11:00</span><strong>참여·취소 마감</strong></div></div></section></aside></div></main></div></div></div><script>                                                  
                                                                         
                                                                                                         
                                                                                 
                                                                                                         
                                                                                                                                                                   
const emptyState = ()        => ({choices:{},days:{},events:[]});
function defaultChoice(person                              )         { return {status:person.defaultStatus||'unset',meal:'any'}; }
function applyDefaults(state      ,dates         ,people         ) {
  for(const date of dates){const choices=state.choices[date]??={};for(const person of people)if(!choices[person.id])choices[person.id]=defaultChoice(person);}
}
const mealNames = { lunchbox:'도시락', outside:'외부 식사', any:'상관없음' };
function seoulDate(now = new Date()) { return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(now); }
function cutoff(date        ) { return new Date(`${date}T11:00:00+09:00`); }
function matchTime(date        ) { return new Date(new Date(`${date}T00:00:00+09:00`).getTime()-2*3600000); }
function weekdays(start        , end        ) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(start)||!/^\d{4}-\d{2}-\d{2}$/.test(end)||start>end) throw new Error('운영 기간 설정을 확인해 주세요.');
  const result         =[]; const cursor=new Date(`${start}T12:00:00Z`);
  while(cursor.toISOString().slice(0,10)<=end) { if(![0,6].includes(cursor.getUTCDay())) result.push(cursor.toISOString().slice(0,10)); cursor.setUTCDate(cursor.getUTCDate()+1); if(result.length>100)throw new Error('운영 기간은 평일 100일 이내로 설정해 주세요.'); }
  return result;
}
const shuffle =     (items    , random           ) => { const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; };
function sizes(n       )          {
  if(n===0)return [];if(n<=5)return [n];
  const possibilities = [3,4,5].filter(x=>n-x>=3).map(x=>[x,...sizes(n-x)]);
  return possibilities.sort((a,b)=>a.filter(x=>x===5).length-b.filter(x=>x===5).length)[0];
}
function encounters(state      , date       , a       , b       ) {
  return Object.entries(state.days).filter(([d,v])=>d<date&&v.phase==='final').reduce((n,[,v])=>n+Number(v.groups.some(g=>g.members.some(p=>p.id===a)&&g.members.some(p=>p.id===b))),0);
}
function repeatCost(state      ,date       ,people         ) {let score=0;for(let i=0;i<people.length;i++)for(let j=i+1;j<people.length;j++)score+=encounters(state,date,people[i].id,people[j].id);return score;}
function initialMatch(state      ,date       ,people         , random = Math.random)         {
  const choice=state.choices[date]??{}; const joined=people.filter(p=>choice[p.id]?.status==='join');
  const box=joined.filter(p=>choice[p.id].meal==='lunchbox');const out=joined.filter(p=>choice[p.id].meal==='outside');const flexible=joined.filter(p=>choice[p.id].meal==='any');
  let best        =[];let bestCost=Infinity;
  for(let attempt=0;attempt<160;attempt++) {
    const pool={lunchbox:[...box],outside:[...out]};
    const split=attempt%(flexible.length+1);const flex=shuffle(flexible,random);
    flex.forEach((p,i)=>pool[i<split?'lunchbox':'outside'].push(p));
    const groups        =[];
    for(const meal of ['lunchbox','outside']         ){const members=shuffle(pool[meal],random);let offset=0;for(const size of sizes(members.length)){groups.push({id:`${date}-${groups.length+1}`,meal,members:members.slice(offset,offset+size)});offset+=size;}}
    const score=groups.reduce((n,g)=>n+(g.members.length<3?(3-g.members.length)*10000:0)+(g.members.length===5?100:0)+repeatCost(state,date,g.members),0)+Math.abs(pool.lunchbox.length-pool.outside.length)*0.001;
    if(score<bestCost){best=groups;bestCost=score;}
  }
  return best;
}
function addMember(state      ,date       ,person       ,meal     ,random=Math.random) {
  const day=state.days[date];if(day.groups.some(g=>g.members.some(p=>p.id===person.id)))return;
  const candidates=shuffle(day.groups.filter(g=>g.members.length<5&&(meal==='any'||meal===g.meal)),random);
  candidates.sort((a,b)=>a.members.length-b.members.length||b.members.reduce((n,p)=>n+encounters(state,date,p.id,person.id),0)-a.members.reduce((n,p)=>n+encounters(state,date,p.id,person.id),0));
  if(candidates[0])candidates[0].members.push({...person});
  else day.groups.push({id:`${date}-${crypto.randomUUID()}`,meal:meal==='any'?(day.groups.filter(g=>g.meal==='lunchbox').length<=day.groups.filter(g=>g.meal==='outside').length?'lunchbox':'outside'):meal,members:[{...person}]});
}
function syncDue(state      ,dates         ,people         ,now=new Date()) {
  applyDefaults(state,dates,people);
  for(const date of dates){if(now<matchTime(date))continue;
    if(!state.days[date])state.days[date]={groups:initialMatch(state,date,people),phase:'matched',matchedAt:now.toISOString()};
    if(now>=cutoff(date)&&state.days[date].phase!=='final'){state.days[date].phase='final';state.days[date].finalizedAt=now.toISOString();}
  }
}
function setChoice(state      ,date       ,person       ,choice       ,now=new Date()) {
  if(now>=cutoff(date))throw new Error('오전 11시 마감 이후에는 변경할 수 없습니다.');
  if(choice.status==='unset')choice=defaultChoice(person);
  const previous=state.choices[date]?.[person.id];
  if(state.days[date]){
    const day=state.days[date];if(day.phase==='final')throw new Error('이미 확정된 날짜입니다.');
    if(choice.status==='join'&&previous?.status==='join'&&choice.meal===previous.meal)return;
    day.groups=day.groups.map(g=>({...g,members:g.members.filter(p=>p.id!==person.id)})).filter(g=>g.members.length);
    if(choice.status==='join')addMember(state,date,person,choice.meal);
  }
  (state.choices[date]??={})[person.id]={...choice};
  state.events.push({date,userId:person.id,action:choice.status==='join'?`참여:${choice.meal}`:choice.status==='absent'?'불참':'미응답',at:now.toISOString()});
}

const demoPeople=ROSTER;

function makeDemo()       {
  const state=emptyState();let seed=42;const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
  for(const [index,date] of demoDates.entries()) {
    state.choices[date]={};
    demoPeople.forEach((p,i)=>{state.choices[date][p.id]=p.defaultStatus==='absent'?defaultChoice(p):{status:i===0&&index>2?'unset':(index+i)%9===8?'absent':'join',meal:i%3===0?'lunchbox':i%3===1?'outside':'any'};});
    if(index<=2)state.days[date]={groups:initialMatch(state,date,demoPeople,random),phase:index<2?'final':'matched',matchedAt:`${date}T00:00:00+09:00`};
  }
  return state;
}
