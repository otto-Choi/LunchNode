name: Verify backend and application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lunch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lunch_test
      ALLOW_DATABASE_RESET: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate administrator migration name
        if: github.head_ref == 'headquarters-administrators'
        run: |
          npx --yes supabase@2.81.3 migration new --help
          npx --yes supabase@2.81.3 migration new headquarters_administrators
      - run: npm audit --omit=dev --audit-level=high
      - name: Check generated SQL and cutover guide
        run: |
          python scripts/build-global-schema.py
          python scripts/build-tmt-schema.py
          python scripts/build-continuous-operation.py
          python scripts/build-persistent-clubs.py
          python scripts/build-headquarters-administrators.py
          python scripts/build-before-cutover.py
          git diff --exit-code -- supabase/ CUTOVER_GUIDE.md
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: google-chrome --version
      - run: npm run test:browser
      - name: Verify public production API after deployment
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 3
        run: node scripts/smoke-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            playwright-report/
            test-results/
            package-lock.json
          retention-days: 7
